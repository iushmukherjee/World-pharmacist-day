<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Pharmacist Day | Alteus</title>
  
  <!-- Cropper.js CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    
    .card {
      background-color: #1e293b;
      padding: 30px;
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    h1 { font-size: 1.6rem; color: #38bdf8; text-align: center; margin-bottom: 5px; }
    p.subtitle { text-align: center; color: #94a3b8; font-size: 0.95rem; margin-bottom: 10px; }

    label { font-size: 0.85rem; color: #cbd5e1; font-weight: 600; display: block; margin-bottom: 6px; }
    input[type="text"], input[type="file"] {
      width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background-color: #0f172a; color: #ffffff; outline: none;
    }
    input[type="text"]:focus { border-color: #38bdf8; }

    .crop-container { max-height: 280px; background-color: #000; overflow: hidden; display: none; border-radius: 8px; margin-top: 5px; }
    .crop-container img { max-width: 100%; }

    .btn-submit {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: transform 0.2s, background 0.2s;
    }
    .btn-submit:hover { transform: translateY(-2px); }
  </style>
</head>
<body>

  <div class="card">
    <h1>Pharmacist Day Special</h1>
    <p class="subtitle">Enter your details to generate your personalized frame</p>

    <div>
      <label for="pharmacistName">Pharmacist Name</label>
      <input type="text" id="pharmacistName" placeholder="Enter Pharmacist Name" value="" autocomplete="off" spellcheck="false">
    </div>

    <div>
      <label for="pharmacyName">Pharmacy Name</label>
      <input type="text" id="pharmacyName" placeholder="Enter Pharmacy Name" value="" autocomplete="off" spellcheck="false">
    </div>

    <div>
      <label for="imageUpload">Upload Profile Photo</label>
      <input type="file" id="imageUpload" accept="image/*">
    </div>

    <div class="crop-container" id="cropWrapper">
      <img id="imageToCrop" src="" alt="To Crop">
    </div>

    <button type="button" class="btn-submit" id="generateBtn">Generate My Frame ✨</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script>
    const imageUpload = document.getElementById('imageUpload');
    const imageToCrop = document.getElementById('imageToCrop');
    const cropWrapper = document.getElementById('cropWrapper');
    const generateBtn = document.getElementById('generateBtn');

    let cropper = null;

    imageUpload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          imageToCrop.src = event.target.result;
          cropWrapper.style.display = 'block';

          if (cropper) cropper.destroy();

          cropper = new Cropper(imageToCrop, {
            aspectRatio: 1,
            viewMode: 1,
            autoCropArea: 0.9,
          });
        };
        reader.readAsDataURL(file);
      }
    });

    generateBtn.addEventListener('click', () => {
      const pName = document.getElementById('pharmacistName').value.trim();
      const phName = document.getElementById('pharmacyName').value.trim();

      if (!pName || !phName) {
        alert("Please fill in both Pharmacist Name and Pharmacy Name.");
        return;
      }

      if (!cropper) {
        alert("Please upload and adjust your photo.");
        return;
      }

      const croppedCanvas = cropper.getCroppedCanvas({ width: 450, height: 450 });
      const croppedImageData = croppedCanvas.toDataURL('image/png');

      sessionStorage.setItem('pharmacistName', pName);
      sessionStorage.setItem('pharmacyName', phName);
      sessionStorage.setItem('croppedImage', croppedImageData);

      window.location.href = 'result.html';
    });
  </script>
</body>
</html>
